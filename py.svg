<svg xmlns="http://w3.org" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Python logo">
  <defs>
    <!-- Gradiente Azul Oficial da Cobra Superior -->
    <linearGradient id="pythonBlue" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#3776AB"/>
      <stop offset="100%" stop-color="#1F486E"/>
    </linearGradient>
    
    <!-- Gradiente Amarelo Oficial da Cobra Inferior -->
    <linearGradient id="pythonYellow" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE873"/>
      <stop offset="100%" stop-color="#FFD343"/>
    </linearGradient>

    <!-- Fundo de contraste escuro opcional para destacar os vetores -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>
  </defs>

  <!-- Fundo escuro arredondado para dar contraste ao escudo do logo -->
  <rect width="100%" height="100%" fill="url(#bgGlow)" rx="30" />

  <!-- Grupo centralizado com a escala e proporções perfeitas do logo Python -->
  <g transform="translate(136, 136) scale(0.95)">
    <!-- Cobra Superior (Azul) - Curva Vetorial Corrigida -->
    <path fill="url(#pythonBlue)" d="M121.5 0c-33.8 0-60.5 4.8-73.5 14.5-19.5 14.5-19 32.7-19 50.9v21.8h48.5v7.3c0 19 15 35.2 34 35.2h47.2c11.2 0 20.7-8.8 20.7-21.8V61.8c0-23.3-17.8-44.9-43.6-52.2-5.1-1.5-9.7-2.6-14.3-2.6z"/>
    
    <!-- Olho da Cobra Azul (Furo Superior Esquerdo) -->
    <circle cx="94.8" cy="30.5" r="9.1" fill="#FFFFFF"/>

    <!-- Cobra Inferior (Amarela) - Curva Vetorial Corrigida -->
    <path fill="url(#pythonYellow)" d="M125.5 245.5c33.8 0 60.5-4.8 73.5-14.5 19.5-14.5 19-32.7 19-50.9v-21.8h-48.5v-7.3c0-19-15-35.2-34-35.2H88.3c-11.2 0-20.7 8.8-20.7 21.8v47.1c0 23.3 17.8 44.9 43.6 52.2 5.1 1.5 9.7 2.6 14.3 2.6z"/>
    
    <!-- Olho da Cobra Amarela (Furo Inferior Direito) -->
    <circle cx="152.2" cy="215" r="9.1" fill="#0f172a"/>
  </g>
</svg>
