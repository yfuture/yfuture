<!-- Importando as fontes diretamente do Google Fonts -->
<link rel="preconnect" href="https://googleapis.com">
<link rel="preconnect" href="https://gstatic.com" crossorigin>
<link href="https://googleapis.com/css2?family=Orbitron:wght@700&family=Share+Tech+Mono&family=Rubik+Glitch&display=swap" rel="stylesheet">

<svg fill="none" viewBox="0 0 400 100" width="400" height="100" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        h1 {
          color: purple;
          animation: mymove 2s infinite;
          font-family: Orbitron;
        }
        @keyframes mymove {
          from {color: blue;}
          to {color: royalblue;}
        }
      </style>
      <h1>JOSE YOSAFAT MENDEZ REBOLLEDO</h1>
    </div>
  </foreignObject>
</svg>
