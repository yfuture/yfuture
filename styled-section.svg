<svg fill="none" viewBox="0 0 550 100" width="550" height="100" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        /* Importação correta e segura para dentro do SVG */
        @import url('https://googleapis.com');

        /* Reset básico para evitar quebras de margem */
        * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
        }

        body, div {
          background: #0a0a12; /* Fundo escuro hacker para dar contraste */
          width: 100%;
          height: 100%;
          display: flex;
          align-items: center;
          justify-content: center;
        }

        h1 {
          font-family: 'Orbitron', sans-serif;
          font-size: 22px;
          letter-spacing: 2px;
          text-align: center;
          animation: hackerPulse 3s infinite alternate;
        }

        /* Animação com transição neon futurista */
        @keyframes hackerPulse {
          0% {
            color: #00ff66;
            text-shadow: 0 0 5px #00ff66, 0 0 10px #00ff66;
          }
          50% {
            color: #00e5ff;
            text-shadow: 0 0 10px #00e5ff, 0 0 20px #00e5ff;
          }
          100% {
            color: #ff0055;
            text-shadow: 0 0 5px #ff0055, 0 0 12px #ff0055;
          }
        }
      </style>
      <h1>JOSE YOSAFAT MENDEZ REBOLLEDO</h1>
    </div>
  </foreignObject>
</svg>
